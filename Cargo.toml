[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Arzaroth/wyrmyon"
homepage = "https://github.com/Arzaroth/wyrmyon"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"

[profile.dist]
inherits = "release"
lto = "thin"
