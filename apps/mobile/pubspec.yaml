name: wyrmyon
description: "Files between a phone and a computer, over magic-wormhole"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  mobile_scanner: 7.5.0
  qr_flutter: 4.1.0
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true

# The launcher icon is the project's dragon (assets/logo.png at the repository root),
# scaled without smoothing for its pixel art. Regenerate: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: ../../assets/logo.png
  adaptive_icon_background: "#151B32"
  adaptive_icon_foreground: assets/icon/foreground.png
