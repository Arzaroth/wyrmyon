[package]
name = "wyrmyon-transfer"
description = "Sends and receives over a wormhole: the offers, the transports, the streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "rt", "time"] }
wyrmyon-transport-classic = { path = "../transport-classic" }
wyrmyon-transport-iroh = { path = "../transport-iroh" }
wyrmyon-wormhole = { path = "../wormhole-core" }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
