[package]
name = "wyrmyon"
description = "A magic-wormhole client that switches to iroh when both peers run wyrmyon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "wyrmyon"
path = "src/main.rs"

[[bin]]
name = "wyrm"
path = "src/bin/wyrm.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
wyrmyon-wormhole = { version = "0.0.0", path = "../wormhole-core" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process"] }
wyrmyon-testkit = { path = "../testkit" }
