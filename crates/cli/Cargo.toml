[package]
name = "wyrmyon"
description = "A magic-wormhole client that switches to iroh when both peers run wyrmyon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "wyrmyon"
path = "src/main.rs"

[[bin]]
name = "wyrm"
path = "src/bin/wyrm.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
indicatif = "0.18.6"
qrcode = { version = "0.14.1", default-features = false }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
rustyline = { version = "18.0.1", features = ["derive"] }
selvedge = { git = "https://github.com/Arzaroth/selvedge", tag = "v0.7.1", default-features = false, features = ["updater"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "signal", "sync"] }
wyrmyon-transport-classic = { path = "../transport-classic" }
wyrmyon-transport-iroh = { path = "../transport-iroh" }
wyrmyon-wormhole = { path = "../wormhole-core" }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "termios"] }

[dev-dependencies]
rqrr = { version = "0.11.0", default-features = false }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process"] }
wyrmyon-testkit = { path = "../testkit" }
