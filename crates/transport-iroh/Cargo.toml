[package]
name = "wyrmyon-transport-iroh"
description = "The iroh-v1 transport: iroh endpoint, address exchange, peer pinning, channel binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
iroh = "1.3"
iroh-blobs = "0.103"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["time"] }
wyrmyon-wormhole = { version = "0.0.0", path = "../wormhole-core" }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
