[package]
name = "wyrmyon-transport-iroh"
description = "The iroh-v1 transport: iroh endpoint, address exchange, peer pinning, channel binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
iroh = { version = "1.3", features = ["unstable-net-report"] }
iroh-blobs = "0.103"
portmapper = "0.19"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["time", "rt-multi-thread", "sync", "macros"] }
wyrmyon-wormhole = { path = "../wormhole-core" }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
wyrmyon-testkit = { path = "../testkit" }
