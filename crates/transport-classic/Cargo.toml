[package]
name = "wyrmyon-transport-classic"
description = "Magic-wormhole classic transit: TCP hint racing, transit relay, records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
hex = "0.4.3"
if-addrs = "0.15.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["net", "io-util", "time", "rt", "sync"] }
wyrmyon-wormhole = { version = "0.0.0", path = "../wormhole-core" }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
wyrmyon-testkit = { path = "../testkit" }
