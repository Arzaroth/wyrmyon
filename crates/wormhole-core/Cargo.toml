[package]
name = "wyrmyon-wormhole"
description = "Magic-wormhole mailbox client, SPAKE2 and the encrypted version exchange"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
crypto_secretbox = "0.1.1"
futures-util = "0.3.34"
hex = "0.4.3"
hkdf = "0.13.0"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
spake2 = "0.4.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["net", "rt", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
unicode-normalization = "0.1.25"
