name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'scripts/package.sh'
      - 'scripts/arch.sh'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'crates/xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

env:
  REF: ${{ github.event.inputs.tag || github.ref }}
  PUBLISH: ${{ github.event_name != 'pull_request' }}
  NFPM_VERSION: 2.47.0
  WIX_VERSION: 5.0.2

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
            nfpm: amd64 3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
            nfpm: arm64 27419eb382695a7942be8ad52259f3ec1854fad001b3ae4baed34ce39a223b97
          - target: aarch64-apple-darwin
            runs-on: macos-latest
          - target: x86_64-apple-darwin
            runs-on: macos-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
            msi: x64
          - target: aarch64-pc-windows-msvc
            runs-on: windows-11-arm
            msi: arm64
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: musl and nfpm
        if: matrix.nfpm
        run: |
          read -r arch sum <<<"${{ matrix.nfpm }}"
          sudo apt-get update -qq
          sudo apt-get install -qq -y musl-tools
          deb="nfpm_${NFPM_VERSION}_$arch.deb"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/$deb"
          echo "$sum  $deb" | sha256sum -c -
          sudo dpkg -i "$deb"

      - name: Version
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [[ $PUBLISH == true ]]; then
            tag="${REF#refs/tags/}"
            if [[ ${tag#v} != "$crate" ]]; then
              echo "::error::tag $tag does not match the workspace version $crate"
              exit 1
            fi
          fi
          echo "VERSION=$crate" >>"$GITHUB_ENV"

      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: The binary reports the version
        if: ${{ !matrix.cross }}
        run: |
          printed=$(target/${{ matrix.target }}/release/wyrmyon --version)
          echo "$printed"
          [[ $printed == "wyrmyon $VERSION" ]]

      - name: Package
        run: scripts/package.sh ${{ matrix.target }} "$VERSION"

      - name: MSI
        if: matrix.msi
        shell: pwsh
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"
          $name = "wyrmyon-v$env:VERSION-${{ matrix.target }}"
          wix build -arch ${{ matrix.msi }} -d Version=$env:VERSION -d StageDir="target/stage/$name" `
            -o "target/dist/$name.msi" packaging/windows/wyrmyon.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item target/dist/*.wixpdb -ErrorAction SilentlyContinue

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: target/dist/*
          if-no-files-found: error

  arch:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed base-devel pacman-contrib cargo git

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: The Linux archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*-linux-musl
          path: target/dist
          merge-multiple: true

      - name: Build the packages
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          git config --global --add safe.directory "$PWD"
          if [[ $PUBLISH == true ]]; then
            curl -fsSL "https://github.com/${{ github.repository }}/archive/refs/tags/v$version.tar.gz" -o target/source.tar.gz
          else
            git archive --prefix="wyrmyon-$version/" HEAD -o target/source.tar.gz
          fi
          useradd -m builder
          chown -R builder .
          su builder -c "scripts/arch.sh bin $version"
          su builder -c "scripts/arch.sh source $version target/source.tar.gz"
          mkdir -p out
          cp target/dist/wyrmyon-bin-*.pkg.tar.zst out/
          tar -czf "out/wyrmyon-v$version-pkgbuild.tar.gz" -C target/dist/arch .

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-arch
          path: out/*
          if-no-files-found: error

  checksums:
    needs: [build, arch]
    runs-on: ubuntu-latest
    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  verify-linux:
    needs: checksums
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            deb: amd64
            rpm: x86_64
            pkg: x86_64
          - runs-on: ubuntu-24.04-arm
            deb: arm64
            rpm: aarch64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: The .deb on Debian 11
        run: |
          docker run --rm -v "$PWD/dist:/d:ro" debian:11 sh -ec '
            apt-get install -qq -y /d/wyrmyon_*_${{ matrix.deb }}.deb >/dev/null
            wyrm --version; test -L /usr/bin/wyrm; test -f /usr/share/man/man1/wyrm.1.gz || test -f /usr/share/man/man1/wyrm.1'

      - name: The .rpm on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/d:ro" fedora:latest sh -ec '
            rpm -i /d/wyrmyon-*.${{ matrix.rpm }}.rpm
            wyrm --version; rpm -V wyrmyon'

      - name: The Arch package
        if: matrix.pkg
        run: |
          docker run --rm -v "$PWD/dist:/d:ro" archlinux:latest sh -ec '
            pacman -U --noconfirm /d/wyrmyon-bin-*-${{ matrix.pkg }}.pkg.tar.zst >/dev/null
            wyrm --version; pacman -Qkk wyrmyon-bin'

      - name: install.sh
        run: |
          home=$(mktemp -d)
          HOME=$home WYRMYON_DOWNLOAD_BASE="file://$PWD/dist" sh scripts/install.sh
          "$home/.local/bin/wyrm" --version

  verify-macos:
    needs: checksums
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: install.sh
        run: |
          home=$(mktemp -d)
          HOME=$home WYRMYON_DOWNLOAD_BASE="file://$PWD/dist" sh scripts/install.sh
          "$home/.local/bin/wyrm" --version

  verify-windows:
    needs: checksums
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: windows-latest
            target: x86_64-pc-windows-msvc
          - runs-on: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: install.ps1
        shell: pwsh
        run: |
          $env:WYRMYON_DOWNLOAD_BASE = (Resolve-Path dist).Path
          ./scripts/install.ps1
          & "$env:LOCALAPPDATA\Programs\wyrmyon\wyrm.exe" --version
          Remove-Item -Recurse -Force "$env:LOCALAPPDATA\Programs\wyrmyon"

      - name: The MSI
        shell: pwsh
        run: |
          $msi = (Get-Item "dist/wyrmyon-v*-${{ matrix.target }}.msi").FullName
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'msi.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content msi.log -Tail 50; exit $p.ExitCode }
          & "$env:LOCALAPPDATA\Programs\wyrmyon\wyrm.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          if (Test-Path "$env:LOCALAPPDATA\Programs\wyrmyon\wyrm.exe") { throw 'the MSI left wyrm.exe behind' }

  release:
    needs: [verify-linux, verify-macos, verify-windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Release notes from the changelog
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          awk -v hdr="## [$version]" '
            index($0, hdr) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md >release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
